site_name: Kernel Panic
site_description: Open source, edge computing, AI agents, distributed systems and open protocols.
site_url: https://kernelpanic2015.github.io/
site_author: Kernel Panic
repo_name: kernelpanic2015/kernelpanic2015.github.io
repo_url: https://github.com/kernelpanic2015/kernelpanic2015.github.io

theme:
  name: material
  custom_dir: overrides
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/console

nav:
  - Home: index.md
  - About: about.md
  - Blog: blog/index.md
  - Projects:
      - Overview: projects/index.md
      - OMNI·ONE: projects/omni-one.md
      - OpenEdge32: projects/openedge32.md
      - ASCP: projects/ascp.md
      - Fable of the Roasted Pigs: projects/fable.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt-BR
          name: Português (Brasil)
          build: true
          site_description: Código aberto, computação de borda, agentes de IA, sistemas distribuídos e protocolos abertos.
          nav_translations:
            Home: Início
            About: Sobre
            Blog: Blog
            Projects: Projetos
            Overview: Visão geral
            OMNI·ONE: OMNI·ONE
            OpenEdge32: OpenEdge32
            ASCP: ASCP
            Fable of the Roasted Pigs: A Fábula dos Porcos Assados

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kernelpanic2015

extra_css:
  - assets/stylesheets/material-home-upstream.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
